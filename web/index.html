<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#422B1C" />
    <!-- Without this, a browser in dark mode paints its own black default
         background during the brief window before index.css loads — visible
         as a flash of black on every cold/uncached reload. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Vayu Gati - pan-India urban air incident-response platform. Delhi is the first city pack." />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Standard tag (Chrome/Android) plus the Apple-specific one for iOS
         Safari, which doesn't yet honor the standard tag on its own. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vayu Gati" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vayu Gati | from information to action</title>
    <!-- Matches body's bg-cream (#F6EFE4) from index.css — painted immediately,
         before the stylesheet loads, so there's never a gap where the browser's
         own default background (black in dark mode) is visible. -->
    <style>html,body{background:#F6EFE4}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
