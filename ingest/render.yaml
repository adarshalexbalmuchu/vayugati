# Render blueprint for the ingest + intelligence service.
# In Render: New → Blueprint → point at this repo. Set the secret env vars
# (marked sync:false) in the dashboard after the first deploy.
#
# One always-on web service: the in-process APScheduler runs ingestion at :10
# and forecast+attribution at :25 each hour, so no separate cron job is needed.

services:
  - type: web
    name: vayugati-ingest
    runtime: docker
    rootDir: ingest
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false # Required — primary AQ ingest source (CPCB/data.gov.in)
      - key: OPENAQ_API_KEY
        sync: false # Optional — fallback for stations CPCB name-match doesn't cover
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENVIRONMENT
        sync: false # set to "staging" or "production" per deployed instance — this blueprint is reused for both
      - key: INGEST_API_KEY
        sync: false # Required in staging/production — gates /run, /intel, /ops, /classify, /readings/refresh, /transit/refresh
      - key: DELHI_OTD_API_KEY
        sync: false # Optional — Delhi OTD real-time GTFS feed; transit context layer silently degrades when unset
      - key: SENTRY_DSN
        sync: false # Optional — Sentry DSN for error tracking; no-op when unset
      - key: FIRMS_MAP_KEY
        sync: false # Optional — NASA FIRMS active-fire API key; vayutrace fire signal skipped when unset
      - key: OSM_PBF_PATH
        value: /data/osm/northern-zone-latest.osm.pbf # path on the persistent disk below
    disk:
      name: vayugati-data
      mountPath: /data
      sizeGB: 2 # ~600 MB for the Geofabrik northern-zone .pbf; 2 GB leaves room for growth
